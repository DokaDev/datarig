[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/drivers/postgres",
    "crates/drivers/mysql",
    "crates/ssh",
    "crates/tls",
    "crates/tui",
    "crates/bench",
]
# A patched dependency, not ours to lint or test (see [patch.crates-io]).
exclude = ["vendor"]

[workspace.package]
version = "0.36.1"
edition = "2024"
rust-version = "1.93"
license = "MIT OR Apache-2.0"
description = "A full-featured database client that lives in your terminal: light, fast, and safe by default"
repository = "https://github.com/DokaDev/datarig"
homepage = "https://github.com/DokaDev/datarig"
readme = "README.md"
keywords = ["database", "postgresql", "mysql", "tui", "sql"]
categories = ["command-line-utilities", "database"]
# Not on crates.io yet: the drivers need the patched tokio-postgres and mysql_async of `vendor/`
# ([patch.crates-io] below), which a published crate cannot carry.
publish = false

[workspace.dependencies]
# Internal crates (dependency direction: tui → core ← driver-postgres/driver-mysql, tui → ssh → core;
# bench → all).
datarig-core = { path = "crates/core" }
datarig-driver-mysql = { path = "crates/drivers/mysql" }
datarig-driver-postgres = { path = "crates/drivers/postgres" }
datarig-ssh = { path = "crates/ssh" }
datarig-tls = { path = "crates/tls" }
datarig-tui = { path = "crates/tui" }

arboard = { version = "3.6", default-features = false }
# The Parquet export's byte strings: one buffer per column of a row group, sliced (parquet's own).
bytes = "1"
chrono = "0.4.45"
# known_hosts: hashed host names (`|1|salt|hash`, HMAC-SHA1) and their base64. Already in the
# tree through russh.
data-encoding = "2.11"
crossterm = { version = "0.29", features = ["event-stream"] }
fallible-iterator = "0.2"
futures = "0.3"
hmac = "0.13"
insta = "1.48.0"
keyring = "4.2.0"
log = "0.4"
# The MySQL driver's client (the vendored copy of `vendor/`, see [patch.crates-io]): none of its
# TLS features (datarig does the handshake over the stream, crates/tls), no compression C library (pure Rust `flate2`, never negotiated), none of the value conversion
# features (the driver reads every value as the text the server sends).
mysql_async = { version = "0.37.1", default-features = false, features = ["minimal-rust"] }
# Parquet export (export::parquet): the file format's own column writers, no Arrow; Snappy only
# (pure Rust `snap`), none of the other codecs (zstd is a C library, brotli and lz4 add size).
parquet = { version = "60", default-features = false, features = ["snap"] }
# PostgreSQL's own parser (libpg_query), for the safety classifier (sql::risk).
pg_query = "6.2"
# pg_query decodes its parse tree with prost, whose default limit of 100 nested messages
# rejected ordinary queries (about 46 chained operators or 50 JOINs); the classifier bounds
# the depth itself (sql::risk::MAX_DEPTH) and parses on a thread with a large stack.
prost = { version = "0.13", default-features = false, features = ["no-recursion-limit"] }
postgres-protocol = "0.6"
ratatui = "0.30"
# Test certificates (CAs, servers, clients), made when the tests run: no key material in the
# repository.
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
# The editor's search (`/`, `?`, `*`): Rust regular expressions, linear time, Unicode-aware.
# Already in the tree on Windows (through keyring).
regex = "1.13"
# PostgreSQL SCRAM channel binding: the hash of the server's certificate. Already in the tree
# through russh and rustls.
ring = "0.17"
# Unix: the effective user id (spill directory ownership) and SIGTSTP for suspending; already in
# the tree via crossterm.
rustix = { version = "1.1", default-features = false, features = ["std", "process"] }
# TLS to the database servers (crates/tls): pure Rust with the `ring` provider (as the SSH
# tunnels), TLS 1.2 and 1.3. The server's certificate is checked against the profile's CA file,
# or the system's trusted certificates through the platform's own verifier (macOS Security
# framework, Windows CryptoAPI, Linux rustls-native-certs): no bundled root list.
# Excel export (export::xlsx): its constant memory mode only (rows go to a temporary file as they
# come; the workbook is zipped at the end). No other feature.
rust_xlsxwriter = { version = "0.100", default-features = false, features = ["constant_memory"] }
rustls = { version = "0.23.45", default-features = false, features = ["std", "tls12", "ring"] }
rustls-platform-verifier = "0.7.1"
# A server certificate's names, for the one a CA file trusts as it is (crates/tls); rustls's own.
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["std"] }
# rustls for tokio (the same features).
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
# SSH tunnels: pure Rust with the `ring` backend
# (no cmake/nasm), RSA keys, and no compression (never negotiated).
russh = { version = "0.63.3", default-features = false, features = ["ring", "rsa"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.11"
shell-words = "1.1"
# The editor's opt-in formatter (`editor.format`); its output is checked token by token against
# the input with datarig's own lexer before it replaces anything.
sqlformat = "0.5"
tokio = "1"
# OSC 11: whether the terminal's background is light or dark (for theme families).
terminal-colorsaurus = "1.0.3"
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4"] }
toml = "1.1.6"
toml_edit = "0.25"
unicode-segmentation = "1"
unicode-width = "0.2"
uuid = { version = "1.26", features = ["v4"] }
zeroize = "1.9"
# Reads the exported workbooks back in the tests (`export::xlsx::read`): the zip rust_xlsxwriter
# writes with.
zip = { version = "9", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

# The query session binds portals with per-column result formats (text for types the driver
# does not decode from binary); tokio-postgres always asks for binary. mysql_async connects only
# over a socket of its own, and the MySQL driver connects over a stream it opened (an SSH
# tunnel's channel). ssh-key (russh's key formats, pinned by russh to this exact version)
# refused an OpenSSH P-256 key whose scalar is shorter than 32 bytes. See vendor/README.md.
[patch.crates-io]
mysql_async = { path = "vendor/mysql_async" }
ssh-key = { path = "vendor/ssh-key" }
tokio-postgres = { path = "vendor/tokio-postgres" }

# libpg_query's parse tree is decoded (prost) and serialized (serde) by code generated in the
# pg_query crate: unoptimized, its frames take tens of KiB per level of nesting, so a debug
# build (the tests) would need far more stack for sql::risk::MAX_DEPTH than a release one.
[profile.dev.package.pg_query]
opt-level = 2

# The release binary is held to 21 MiB (crates/bench/budgets.toml): a single codegen
# unit with LTO drops the code no caller reaches, and stripping drops the symbol table (panic
# messages keep their file and line). Without them the Linux x86_64 binary was 20.7 MiB.
[profile.release]
lto = true
codegen-units = 1
strip = true
