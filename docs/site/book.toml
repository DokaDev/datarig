[book]
title = "datarig: a terminal database client"
description = "A terminal database client and SQL editor (TUI): browse, query, edit and monitor your databases. Keyboard-first, light, fast and safe by default."
language = "en"
src = "src"

[build]
build-dir = "book"
# A page listed in SUMMARY.md that does not exist fails the build instead of being made empty.
create-missing = false

[output.html]
site-url = "/datarig/"
git-repository-url = "https://github.com/DokaDev/datarig"
