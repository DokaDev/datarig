# cargo-about (https://embarkstudios.github.io/cargo-about/): the notices of every third-party
# crate built into datarig, generated by scripts/third-party-notices.sh as
# THIRD-PARTY-NOTICES.html from about.hbs. The C code that pg_query compiles in has its notices in
# vendor/licenses/pg_query/, which the script appends.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unlicense",
    "BSL-1.0",
    "WTFPL",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "PostgreSQL",
]
# The notices of what ships in the binary, not of test-only tools.
ignore-dev-dependencies = true
ignore-build-dependencies = false
# The workspace's own crates (publish = false) are datarig itself, not third-party code.
private = { ignore = true }
workarounds = ["ring"]
