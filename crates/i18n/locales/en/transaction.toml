# datarig: English messages, transaction. The English catalog is the source of truth for keys;
# placeholders use {name}; text that is not English is written with \u escapes. See
# docs/architecture.md, "UI strings (i18n)".

"tx.changes" = { one = "{count} change", other = "{count} changes" }
"tx.rows" = { one = "{count} row", other = "{count} rows" }
"tx.none" = "No transaction is open in this tab"
"tx.not_supported" = "This connection can't commit or roll back from here: run COMMIT or ROLLBACK instead"
"tx.committing" = "Committing…"
"tx.rolling_back" = "Rolling back…"
"tx.began" = "Statement {step} started a transaction: it stays open until you commit ({commit}) or roll back ({rollback})"
"tx.committed" = { one = "Committed {count} change · {rows} · {time}", other = "Committed {count} changes · {rows} · {time}" }
"tx.rolled_back" = { one = "Rolled back {count} change · {time}", other = "Rolled back {count} changes · {time}" }
"tx.rolled_back_instead" = "Not committed: the transaction had failed, so the server rolled it back; nothing of it was kept"
"tx.commit_failed" = "Commit failed: {error}. The server rolled the transaction back"
"tx.rollback_failed" = "Rollback failed: {error}"
"tx.only_rollback" = "The transaction failed: only rollback is possible ({key})"
"tx.idle_timeout" = "The server ended the session because the transaction was idle too long, and rolled it back: {error}"
"tx.lost" = "The server rolls back the transaction that was open"
"tx.server_rolled_back" = { one = "The server rolled back the whole transaction (a deadlock or a lock wait timeout): {count} change is gone", other = "The server rolled back the whole transaction (a deadlock or a lock wait timeout): {count} changes are gone" }
"tx.committed_implicitly" = { one = "Statement {step} committed the open transaction implicitly: {count} change was kept", other = "Statement {step} committed the open transaction implicitly: {count} changes were kept" }
"tx.closed_unknown" = "The transaction ended while server code failed: its changes may or may not have been kept, so check the data"
"tx.manual_rolled_back" = "Statement {step} and the ones after it were rolled back with the transaction opened for it"
"tx.run_rolled_back" = "This run was undone; the open transaction keeps what earlier runs did"
"tx.no_tx_block_refused" = "Not run: {sql} can't run inside a transaction. Commit ({commit}) or roll back ({rollback}) first"
"tx.lock_tables_refused" = "Not run: LOCK TABLES doesn't work with manual commit (the next write would start a transaction and release the locks). Use automatic commit for this"
"tx.enum_value" = "Statement {step} adds an enum value: it can't be used until the transaction commits"
"tx.mysql_ddl" = "Statement {step}: MySQL applies DDL at once; it can't be rolled back"
"tx.how_manual" = "manual commit"
"tx.how_user" = "your own transaction"
"tx.summary" = { one = "Open transaction ({how}): {count} change · {rows} · open for {time}", other = "Open transaction ({how}): {count} changes · {rows} · open for {time}" }
"tx.outside_title" = "Run outside a transaction?"
"tx.outside_kept" = "Not run: the procedure stays unrun"

# The open transaction's lifecycle
"tx.button.rollback" = "Roll back first"
"tx.button.commit" = "Commit first"
"tx.pending" = { one = "{count} change ({rows}) uncommitted for {time}", other = "{count} changes ({rows}) uncommitted for {time}" }
"tx.pending_tab" = { one = "Tab {tab}: {count} change ({rows}) uncommitted for {time}", other = "Tab {tab}: {count} changes ({rows}) uncommitted for {time}" }
"tx.idle_warning" = "Tab {tab}: the open transaction has been idle for {time} and holds its locks: commit ({commit}) or roll back ({rollback})"
"tx.idle_rollback_warning" = "Tab {tab}: the open transaction has sat idle and is rolled back in {time} (the session stays open): commit ({commit}) or roll back ({rollback})"
"tx.idle_rolling_back" = "Rolling back the transaction idle for {time}…"
"tx.idle_rolled_back" = { one = "Rolled back after {time} idle: {count} change undone; the session stays open", other = "Rolled back after {time} idle: {count} changes undone; the session stays open" }
"tx.end_idle_rolling_back" = "Nothing done: tab {tab}'s transaction is being rolled back for sitting idle (that tab says how it ends); nothing was committed or rolled back on request"
"tx.idle_close_warning" = "Tab {tab}: the session closes in {time} for being unused, and the server rolls back its open transaction then: commit ({commit}) or roll back ({rollback})"
"tx.button.rollback_now" = "Roll back"
"tx.button.commit_now" = "Commit"
"tx.summary_title" = "Open transaction ({how})"
"tx.summary_keys" = "c commit · r roll back · j/k scroll · Esc close"
"tx.summary_keys_rollback" = "r roll back · j/k scroll · Esc close"
"tx.summary_empty" = "Nothing that may write has run in it yet"
"tx.summary_footer" = { one = "{count} change · {rows} · open {time} · idle {idle}", other = "{count} changes · {rows} · open {time} · idle {idle}" }
"tx.rule_changed" = "The commit rule changed: the open transaction stays open until you commit or roll back"
"tx.ddl_lock_exclusive" = "Statement {step} holds an ACCESS EXCLUSIVE lock on {target} until you commit or roll back: other sessions' reads of it wait"
"tx.ddl_lock_share" = "Statement {step} holds a SHARE lock on {target} until you commit or roll back: other sessions' writes to it wait"
"tx.call_in_tx" = "This procedure or DO block ends transactions itself, so it can't run in the open transaction: commit or roll back first, then run it again"
"tx.choice_keys" = "c commit · r roll back · y {go} (rolls back) · Enter/n stay"
"tx.choice_keys_rollback" = "r roll back · y {go} (rolls back) · Enter/n stay"
"tx.go.close" = "close anyway"
"tx.go.quit" = "quit anyway"
"tx.go.disconnect" = "disconnect anyway"
"tx.go.delete" = "delete anyway"
"tx.go.switch" = "switch anyway"
"tx.end_stopped_commit" = "Stopped at tab {tab}: its transaction did not commit as asked (that tab says why). The tabs before it were committed; nothing after it was done"
"tx.end_stopped_rollback" = "Stopped at tab {tab}: its transaction did not roll back as asked (that tab says why). The tabs before it were rolled back; nothing after it was done"
"tx.end_pending_commit" = "Committing tab {n} of {total} first, then {go} · Esc stops waiting"
"tx.end_pending_rollback" = "Rolling back tab {n} of {total} first, then {go} · Esc stops waiting"
"tx.end_busy" = "Another answer is waiting for transactions to end; Esc stops it first"
"tx.end_dropped" = "Stopped waiting: what was asked of the server still says how it ended; nothing else is done"
"tx.end_tab_gone" = "Stopped: a tab the answer waited for was closed; nothing else is done"
"tx.end_changed" = "Not switched: the tab is not the active one any more"
"tx.end_gone" = "Nothing done: the transaction of tab {tab} ended meanwhile (that tab says how); nothing was committed or rolled back on request"
"tx.idle_warning_aborted" = "Tab {tab}: the failed transaction has been idle for {time} and holds its locks: roll back ({rollback})"
"tx.ddl_lock_drop_index" = "Statement {step} holds an ACCESS EXCLUSIVE lock on the table of index {target} until you commit or roll back: other sessions' reads of it wait"
"tx.ddl_lock_kept" = "Statement {step} keeps locks on {target} until you commit or roll back"
