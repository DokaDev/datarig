# datarig: English messages, engine. The English catalog is the source of truth for keys;
# placeholders use {name}; text that is not English is written with \u escapes. See
# docs/architecture.md, "UI strings (i18n)".

"engine.why.not_checked" = "not checked on this connection yet"
"engine.why.version_unknown" = "the server's version could not be read"
"engine.why.versions_disagree" = "the server's own reports name different versions"
"engine.why.engines_disagree" = "the server's greeting and VERSION() name different engines"
"engine.why.not_on_engine" = "the engine has no such thing"
"engine.why.not_built" = "datarig does not do this on this engine"
"engine.why.version_too_old" = "the server's version is older than {needed}"
"engine.why.feature_off" = "{feature} is off on the server"
"engine.why.marker_unconfirmed" = "this tab's own session could not be confirmed on the server"
"engine.unconfirmed" = "the server's engine could not be confirmed: VERSION() gave no answer ({greeting} by its greeting), so the session was closed before anything else ran on it"
"engine.reports_changed" = "The server's greeting and VERSION() turned out to name two engines after this was checked: nothing was sent. Run it again to have it checked by both engines' rules"
"engine.comment_unsupported" = "MariaDB-only executable comments (`/*M! … */`) are not supported here: write `/*! … */` instead. Nothing was sent"
"engine.dollar_quotes_unknown" = "This text has a `$$` quote, and the server's greeting and VERSION() disagree on whether it reads them: nothing was sent"
