"setting.default_source.about" = "Where a new profile keeps its password. Auto uses the OS keychain when it works, else asks on every connect."
"setting.commands_position.about" = "Where the : command line opens: a box near the top with the matches below the input, or the last line with the matches above it."
"setting.detail_view.about" = "How the result inspector (i in the grid) shows the selected cell: a panel with Cell and Row tabs, or a one-line preview in the status bar."
"setting.clipboard.about" = "How copies reach the clipboard. OSC 52 goes through the terminal, so it also works over SSH; inside tmux it needs set -g set-clipboard on."
"setting.copy_header.about" = "Whether TSV copies of y and Y and CSV copies start with a row of column names. Auto: when more than one row is copied (CSV: always, unless off)."
"setting.copy_format.about" = "The format y and Y copy a selection or a row in; one cell without a selection is copied as its value. SQL INSERT needs rows that are certainly of one table, else the copy is TSV and says why. g p pastes the copied cells whatever the format."
