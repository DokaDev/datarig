"setting.cursor_shape" = "Cursor shape"
"setting.cursor_shape.about" = "The cursor shows the editor's mode: a block in Normal and Visual, a bar in Insert and while typing into any text field. Off leaves the terminal's own cursor alone."
"setting.cursor_shape.on" = "By mode (block or bar)"
"setting.cursor_shape.off" = "The terminal's own"
"setting.editor_clipboard" = "Yanks to the clipboard"
"setting.editor_clipboard.about" = "Whether y, d, c, x and the other yanks and deletes that name no register also go to the system clipboard, as in Vim with clipboard=unnamedplus (the clipboard setting decides how they get there). \"+ and \"* always do, \"a to \"z and \"_ never. \"+p reads the clipboard only when you type it."
"setting.editor_clipboard.on" = "Yes, as Vim with clipboard=unnamedplus"
"setting.editor_clipboard.off" = "No, only \"+ and \"*"
"setting.format_keyword_case" = "Formatter: keywords"
"setting.format_keyword_case.about" = "How the formatter (Space e f, :format) writes the words the editor highlights as keywords. Names, strings and comments are never changed."
"setting.format_keyword_case.preserve" = "As written"
"setting.format_keyword_case.upper" = "UPPER CASE"
"setting.format_keyword_case.lower" = "lower case"
"setting.format_indent" = "Formatter: indent"
"setting.format_indent.about" = "How many spaces the formatter indents each level with."
"setting.format_indent.four" = "4 spaces"
"setting.format_indent.two" = "2 spaces"
"setting.auto_pairs" = "Auto-pairs"
"setting.auto_pairs.about" = "Whether ( [ { ' \" and ` typed in Insert mode also put their closing character after the cursor (typing it there steps over it, Backspace deletes the empty pair). Never inside strings or comments, before a word, or for a paste. Off is how Vim types."
"setting.auto_pairs.off" = "Off, every key types itself"
"setting.auto_pairs.on" = "On, brackets and quotes close themselves"
"setting.soft_tab_backspace" = "Backspace to tab stop"
"setting.soft_tab_backspace.about" = "Whether Backspace in Insert mode deletes the spaces before the cursor back to the tab stop (every 4 columns) at once, as Tab types them, when nothing but spaces lies between (as Vim's softtabstop=4 does then). With anything else between, such as a letter or a tab character, Backspace deletes one character."
"setting.soft_tab_backspace.on" = "On, spaces back to the tab stop at once"
"setting.soft_tab_backspace.off" = "Off, one space at a time"
"setting.run_hints" = "Run hints"
"setting.run_hints.about" = "Whether a dim hint after a statement's last line says what its last run did (rows, rows affected, the error, rolled back or cancelled, how long it took and when). The hint is not part of the text: it is never yanked, saved or searched, and it goes when the statement is edited."
"setting.run_hints.on" = "On, the outcome after each statement run"
"setting.run_hints.off" = "Off, the editor shows the text only"
"setting.completion_delay" = "Completion delay (ms)"
"setting.completion_delay.about" = "How long the completion popup waits after the last key typed in Insert mode before it opens by itself (once a name has 2 characters, after a dot or an opening quote). Nothing opens before it; the completion key (editor.complete) opens the popup at once whatever the delay."
"setting.completion_delay.ms" = "Opens once no key came for this many milliseconds"
"setting.completion_delay.now" = "No wait: opens with the key that calls for it"
"setting.size_heat" = "Explorer: size colours"
"setting.size_heat.about" = "Whether, and in how many levels, the explorer colours the estimates of the largest tables of each schema: the largest tenth by size (one at least). 3 levels: amber from 1 MiB, red from 1 GiB. 5 levels: yellow from 1 MiB, amber from 100 MiB, orange from 1 GiB, red from 10 GiB. Only the estimates already read are used; nothing more is asked of the server."
"setting.size_heat.three" = "3 levels: amber from 1 MiB, red from 1 GiB"
"setting.size_heat.five" = "5 levels: yellow, amber from 100 MiB, orange from 1 GiB, red from 10 GiB"
"setting.size_heat.off" = "Off, every estimate is dim"
"setting.filter_history" = "Filter history"
"setting.filter_history.about" = "Whether a table tab keeps the filters and orders that ran, per table, in a file of the state directory that only you can read, so Ctrl+R in the filter dialog can pick one again. Off keeps nothing new; what the file holds stays until :filter history clear removes it."
"setting.filter_history.on" = "On, each table keeps its last filters"
"setting.filter_history.off" = "Off, no filter is kept"
"setting.yank_flash" = "Flash copied cells"
"setting.yank_flash.about" = "Whether the cells a copy took from the results grid flash briefly once the copy was sent to the clipboard. A copy that fails or is refused does not flash."
"setting.yank_flash.on" = "On, copied cells flash briefly"
"setting.yank_flash.off" = "Off, a copy is said in the status bar only"
"setting.tips" = "Tips"
"setting.tips.about" = "Whether empty places show a tip about a key (an empty editor or result, the workspace without tabs, spare room in the status bar), the welcome panel its first steps, and an action run from a menu a few times names its key once. Always: the tips of a place take turns and keep coming back; a tip about a key you already used shows less often. Until used: a tip goes away once you used its key. Tips follow the key bindings, remapped keys included."
"setting.tips.always" = "Always, in empty places"
"setting.tips.until_used" = "Until its key is used"
"setting.tips.off" = "Off, no tips"
"setting.idle_disconnect" = "Close idle connections"
"setting.idle_disconnect.about" = "How long a connection may sit unused before the app closes it: each tab's session on its own, then the connection's other sessions and its SSH tunnel. The next run or explorer action connects again. A tab with an open transaction is warned a minute before; the server rolls the transaction back when its session closes. The server also gets a limit a minute longer for each query session (PostgreSQL 14 or later on a direct connection, MySQL). An environment can set its own. Startup SQL may set the server's idle limit itself (PostgreSQL idle_session_timeout, MySQL wait_timeout): that value is then the limit of those sessions."
"setting.idle_disconnect.off" = "Off, connections stay open"
"setting.idle_disconnect.on" = "Close a connection unused this long"
"setting.lock_wait" = "Lock wait limit"
"setting.lock_wait.about" = "How long a statement of a query session waits for a lock another session holds before the server cancels it (PostgreSQL lock_timeout; MySQL lock_wait_timeout and innodb_lock_wait_timeout). Off keeps the server's setting. Explorer lookups keep their own two seconds. An environment can set its own, and a Startup SQL or a profile's own startup SQL its own for its sessions."
"setting.lock_wait.off" = "Off, the server's setting"
"setting.lock_wait.on" = "Give up waiting for a lock after this long"

