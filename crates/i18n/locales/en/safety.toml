# datarig: English messages, safety. The English catalog is the source of truth for keys;
# placeholders use {name}; text that is not English is written with \u escapes. See
# docs/architecture.md, "UI strings (i18n)".

"safety.confirm.title" = { one = "Run a statement that may do harm?", other = "Run {count} statements that may do harm?" }
"safety.confirm.keys" = "y run · Enter chooses · Tab switch · n/Esc cancel"
"safety.confirm.cancel" = "Cancel"
"safety.confirm.run" = "Run"
"safety.confirm.target" = "target: {target}"
"safety.confirm.more" = { one = "… and {count} more statement", other = "… and {count} more statements" }
"safety.confirm.cancelled" = "Not run: cancelled at the confirmation"
"safety.confirm.moved" = "Not run: the tab's connection changed before the confirmation"
"safety.why.drop" = "drops it"
"safety.why.truncate" = "empties the table (TRUNCATE)"
"safety.why.delete_all" = "deletes every row"
"safety.why.update_all" = "updates every row"
"safety.why.drop_column" = "drops a column"
"safety.why.write" = "writes"
"safety.why.ddl" = "changes the schema"
"safety.why.maintenance" = "maintenance"
"safety.why.procedural" = "runs code that cannot be checked (DO/CALL)"
"safety.why.unknown" = "not known to be safe"
"safety.why.no_where" = "no WHERE"
"safety.why.always_true" = "its WHERE is always true"
"safety.why.explain" = "EXPLAIN ANALYZE runs it, then rolls it back"
"safety.why.no_column" = "its WHERE reads no column"
"safety.why.other_tables" = "its WHERE and joins read no column of the table it changes"
"safety.why.alter_type" = "converts a column to another type, which may lose data (ALTER … TYPE)"
"safety.why.merge" = "MERGE that updates or deletes rows"
"safety.why.unknown_prepared" = "runs a prepared statement not known to this tab"
"safety.why.unparsed" = "PostgreSQL's parser cannot read it"
"safety.why.too_complex" = "too long or too deeply nested to check"
"safety.why.copy_program" = "runs a program on the database server (COPY … PROGRAM)"
"safety.why.copy_file" = "reads or writes a file on the database server (COPY with a file name)"
"safety.why.server_file" = "reads, writes or lists files on the database server (a built-in function)"
"safety.why.server_action" = "acts on the database server beyond this transaction (a built-in function)"
"safety.why.runs_query_text" = "runs a query given as text that cannot be checked (a built-in function)"
"safety.why.exec_comment" = "has an executable comment (/*! … */), which the server runs or skips by its version"
"safety.why.unrecognized" = "not a form of statement the safety check knows"
"safety.why.locks" = "takes locks that block other sessions until released (LOCK TABLES, HANDLER, …)"
"safety.why.privileges" = "changes accounts or privileges"
"safety.why.rename" = "renames it: what uses the old name breaks"
"safety.why.analyze_runs_code" = "EXPLAIN ANALYZE runs it, with a function that is not a built-in: what the function writes to a non-transactional table (MyISAM) is not rolled back"
"safety.why.setting" = "changes a session setting that turns a server check off or changes how SQL is read"
"safety.why.dynamic_sql" = "prepares SQL given as text that cannot be checked (PREPARE)"
"safety.why.server_command" = "acts on the whole database server, beyond this session (KILL, FLUSH, SET GLOBAL, …)"
"safety.why.file_access" = "reads or writes a file (LOAD DATA, SELECT … INTO OUTFILE)"
"safety.explain_rolled_back" = "EXPLAIN ANALYZE ran the statement to measure it, then rolled it back: no changes kept (sequence values it used stay used)"
"safety.read_only.blocked" = "Not run: the environment \"{environment}\" is read-only and {what}: {sql}"
"safety.read_only.reconnect" = "Not run: the environment \"{environment}\" became read-only after this tab connected; reconnect ({key}) to apply it"
"safety.copy_stdio" = "Not run: COPY … FROM STDIN and COPY … TO STDOUT are not supported yet (to see the rows, run the query as a SELECT; to move data to or from a file, use psql's \\copy): {sql}"
"safety.blocked.write" = "this statement writes"
"safety.blocked.ddl" = "this statement changes the schema"
"safety.blocked.maintenance" = "this is a maintenance statement"
"safety.blocked.procedural" = "this statement runs code that cannot be checked"
"safety.blocked.unknown" = "this statement is not known to be a read"
"safety.blocked.read_write" = "this statement asks for a read-write transaction"
"safety.blocked.setting" = "this setting is not on the read-only allowlist"
"safety.blocked.unparsed" = "PostgreSQL's parser cannot read this statement"
"safety.blocked.too_complex" = "this statement is too long or too deeply nested to check"
"safety.blocked.server_file" = "this statement reads, writes or lists files on the database server"
"safety.blocked.server_action" = "this statement acts on the database server beyond its transaction"
"safety.blocked.runs_query_text" = "this statement runs a query given as text that cannot be checked"
"safety.blocked.exec_comment" = "this statement has an executable comment (/*! … */)"
"safety.blocked.unrecognized" = "this statement is not a form the safety check knows"
"safety.blocked.unknown_function" = "this statement calls a function that is not a built-in, whose effects cannot be checked"
"safety.blocked.dynamic_sql" = "this statement prepares SQL given as text"
"safety.blocked.server_command" = "this statement acts on the whole database server"
"safety.blocked.locks" = "this statement takes locks that block other sessions"
"safety.blocked.file_access" = "this statement reads or writes a file"
"safety.why_outside_tx" = "runs outside a transaction, at once: can't be rolled back"
"safety.why_commits_itself" = "commits by itself: runs outside, at once; can't be rolled back"
"safety.why_implicit_commit" = { one = "first commits the open transaction: {count} statement ({rows})", other = "first commits the open transaction: {count} statements ({rows})" }
