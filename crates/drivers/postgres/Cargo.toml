[package]
name = "datarig-driver-postgres"
description = "PostgreSQL driver for datarig (tokio-postgres)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[dependencies]
datarig-core.workspace = true
chrono.workspace = true
fallible-iterator.workspace = true
futures.workspace = true
postgres-protocol.workspace = true
# The table structure comes as one JSON document (one round trip).
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "sync", "time"] }
tokio-postgres.workspace = true

[dev-dependencies]
datarig-core = { workspace = true, features = ["test-util"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util"] }

[lints]
workspace = true
