[package]
name = "datarig-core"
description = "UI-independent core of datarig: driver abstraction, SQL tooling, profiles, secrets, config, i18n"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

# No UI crates (ratatui/crossterm) and no concrete drivers here.
[dependencies]
bytes.workspace = true
futures.workspace = true
keyring.workspace = true
parquet.workspace = true
pg_query.workspace = true
# Only for its feature: see the workspace manifest.
prost.workspace = true
rust_xlsxwriter.workspace = true
# Only for `test-util` (`export::xlsx::read`).
zip = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
shell-words.workspace = true
sqlformat.workspace = true
tokio = { workspace = true, features = ["sync"] }
toml.workspace = true
toml_edit.workspace = true
unicode-width.workspace = true
uuid.workspace = true

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

# build.rs: checks the locale catalogs and generates the typed message API.
[build-dependencies]
toml.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "net", "io-util"] }
zip.workspace = true

[features]
# `ConnectionConfig::test_db()`, `transport::TcpDialer`, `export::xlsx::read` and
# `export::parquet::read` for the tests of the other crates.
test-util = ["tokio/net", "dep:zip"]

[lints]
workspace = true
