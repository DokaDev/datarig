# The engine seam budget, checked by tests/engine_seam.rs: per kind of finding, per area, the
# number of sites the code has. An area is a module path; a file counts in the longest area that
# holds it. A count may not rise. A change that lowers a count lowers its budget too, and the
# change that moves an area behind the seam brings it to 0 (and may then delete the line).
# A site in an area not listed has a budget of 0.

# Variants of the engine enums named outside the seam modules.
[references]
"crates/bench/src/editor" = 1
"crates/bench/src/export" = 1
"crates/bench/src/monitor" = 1
"crates/core/src/edit" = 3
"crates/core/src/export" = 14
"crates/core/src/monitor" = 14
"crates/core/src/profile" = 2
"crates/core/src/query" = 63
"crates/drivers/mysql/src/connect" = 0
"crates/drivers/mysql/src/meta" = 9
"crates/drivers/mysql/src/monitor" = 2
"crates/drivers/mysql/src/query" = 8
"crates/drivers/mysql/src/session" = 0
"crates/drivers/postgres/src/connect" = 0
"crates/drivers/postgres/src/monitor" = 2
"crates/drivers/postgres/src/query" = 1
"crates/tui/src/app" = 36
"crates/tui/src/widgets" = 4

