# Performance budgets that CI holds datarig to (`datarig-bench budget`, docs/perf.md).
#
# Round trips are exact counts through the latency proxy, so they do not depend on the machine.
# Memory and wakeups are counts too. Times have a wide margin over what a developer machine
# measures, because CI runners are slower and shared.

[rtt]
# One-way latency of the proxy. Long enough that the pieces of one flight always reach the
# proxy before the server can answer; the counts do not depend on it.
one_way_ms = 20
runs = 5
# Most round trips until the result is in front of the client ("to result") and until the
# session is quiet again ("total", a trailing COMMIT or close included). By default
# (`paging = "no_hold"`) the first page's COMMIT goes out with it: nothing follows the page, and
# a large result keeps nothing open either.
select_small_cold = { to_result = 2, total = 2 }
select_small_warm = { to_result = 1, total = 1 }
select_page_of_4m_cold = { to_result = 2, total = 2 }
select_page_of_4m_warm = { to_result = 1, total = 1 }
# `paging = "hold"`: a result that fits in a page commits after it; a large one keeps its portal
# (and its transaction) open, and the next page is fetched from it.
hold_select_small_warm = { to_result = 1, total = 2 }
hold_select_page_of_4m_warm = { to_result = 1, total = 1 }
next_page = { to_result = 1, total = 1 }
# A count the user asks for, while a result pages (under a savepoint in its
# transaction, `paging = "hold"`) and with no portal open; a result resumed past a closed portal
# or one never held (the next page of the default), 500 rows skipped (the page after them comes
# with the skipped rows, and its COMMIT with them). Each first asks the server what only it can
# tell for the allowlist (views, overloads of built-in names, …): one round trip more. Inside the
# user's block the savepoint goes out with that question, and the statement is prepared again
# (as every statement there).
count_while_paging = { to_result = 2, total = 2 }
count_idle = { to_result = 2, total = 2 }
resume_warm = { to_result = 2, total = 2 }
resume_in_block = { to_result = 3, total = 3 }
insert = { to_result = 1, total = 1 }
# Manual commit: the write that opens the transaction, its BEGIN in the same write.
manual_first_write = { to_result = 1, total = 1 }
select_small_in_block = { to_result = 2, total = 3 }
insert_in_block = { to_result = 1, total = 1 }
# A read-only policy (every transaction READ ONLY): the same counts as the statements above,
# because BEGIN READ ONLY and SET TRANSACTION READ ONLY go out in the same write.
ro_select_small_cold = { to_result = 2, total = 2 }
ro_select_small_warm = { to_result = 1, total = 1 }
ro_select_page_of_4m_warm = { to_result = 1, total = 1 }
ro_set = { to_result = 1, total = 1 }
ro_first_in_block = { to_result = 2, total = 3 }
# A chunk of an export of a table read by its key: its own read-only transaction opened with the
# statement's Parse (one round trip), the rows of the chunk with its Bind (one), its COMMIT (one).
export_keyset_chunk = { to_result = 3, total = 3 }
# Opening a table in the explorer: its whole structure (columns, keys, indexes, constraints,
# triggers, size estimate) is one catalog statement on the metadata session.
table_structure = { to_result = 1, total = 1 }
# Opening a schema in the explorer: its tables and views with the estimates of each one's rows
# and size, one catalog statement too.
schema_objects = { to_result = 1, total = 1 }
# Show DDL of a table: its structure and what its CREATE statement needs, the lookup, the search
# path and the lock check go out together (one catalog read in one transaction).
table_ddl = { to_result = 1, total = 1 }

[rtt_ssh]
# The same statements through an SSH tunnel (the proxy sits between the client
# and the bastion of the tests). The tunnel adds latency to each packet, never a round trip, so
# the counts are the direct ones. Opening the tunnel (key exchange, host key, login with a key)
# and a session through it (a channel, then the database's own startup and SCRAM) are counted
# too: measured 5 or 6, and 4, against OpenSSH 10. Opening the tunnel is not a fixed count: the
# server sends its key exchange reply, NEWKEYS and ext-info in one write or in two depending on
# timing, and the proxy counts a split as another round trip, so the budget allows the 6.
one_way_ms = 20
runs = 5
tunnel_open = { to_result = 6, total = 6 }
session_through_tunnel = { to_result = 4, total = 4 }
select_small_cold = { to_result = 2, total = 2 }
select_small_warm = { to_result = 1, total = 1 }
select_page_of_4m_warm = { to_result = 1, total = 1 }
next_page = { to_result = 1, total = 1 }
insert = { to_result = 1, total = 1 }

[rtt_mysql]
# The MySQL driver's query session through the latency proxy (crates/bench/src/rtt_mysql.rs).
# Opening a session: the login (answered at once from the server's cache) and the session's
# settings in one statement. A result is one round trip, a page of a large one too: the
# session's sql_select_limit (a page and one row more) ends the statement with its first page.
# The next page asks the server whether a name it reads is a view, sets the larger limit (only
# when it changes) and runs the statement again; the statement after it sets the page's limit
# back. A held result's next page is read from what the server sent already. A count asks the
# same question first. A table's structure is one statement on the metadata session, and so is
# its DDL (SHOW CREATE TABLE).
one_way_ms = 20
runs = 5
session_open = { to_result = 2, total = 2 }
select_small = { to_result = 1, total = 1 }
select_page_of_many = { to_result = 1, total = 1 }
resume = { to_result = 3, total = 3 }
select_page_after_resume = { to_result = 2, total = 2 }
hold_select_page_of_many = { to_result = 1, total = 1 }
next_page = { to_result = 1, total = 1 }
count = { to_result = 2, total = 2 }
insert = { to_result = 1, total = 1 }
select_small_in_block = { to_result = 1, total = 1 }
insert_in_block = { to_result = 1, total = 1 }
ro_select_small = { to_result = 1, total = 1 }
table_structure = { to_result = 1, total = 1 }
table_ddl = { to_result = 1, total = 1 }

[paging]
# SELECT * FROM analytics.events to the end (8,000 pages of 500 rows).
max_pages = 8000
# Resident memory of the whole headless app process.
rss_mib_max = 96
# Growth from 125,000 rows (the window is full and spilling) to 4,000,000 rows: the rows past the
# window live on disk, so memory must stay flat.
rss_growth_mib_max = 16

[export]
# `:export all <file>.csv` of SELECT * FROM analytics.events (4,000,000 rows) with the headless
# app: once streamed with one statement, once as a table tab read in chunks by its key. The rows
# go from the session through a channel of two batches to the file, never into the app's result:
# resident memory of the whole process, and its growth from 250,000 rows written to the end,
# must stay flat. Rows written per second, with a wide margin for CI (a developer machine:
# see docs/perf.md).
rss_mib_max = 96
rss_growth_mib_max = 16
rows_per_s_min = 50000
# The same rows as an Excel workbook (`export_xlsx`: four sheets, zipped at the end): the same
# memory budgets (each second it says nothing is a sample too, the zipping among them). A
# workbook is slower to write (every cell is XML, then compressed): its own rows per second.
xlsx_rows_per_s_min = 20000
# The same rows as a Parquet file (`export_parquet`: row groups of 65,536 rows, each kept in
# memory until it is written): the same memory budgets, and rows per second of its own.
parquet_rows_per_s_min = 50000

[editor]
# Keystroke to frame in a 5 MB file at 160x45 (a developer machine: about 0.5 ms). A theme
# switch (`:set theme=`, then its frame), moving among the hints of finished runs (every
# statement around the cursor has one), and keys typed in a string literal compared with an
# enumerated column (the completion popup of its values made at each key, its timer run; also
# with the literal unclosed above the file's first line, paired with a quote further on) are
# held to the same budget, as are the keys of the `editor_mysql` scenario (a 5 MB MySQL script
# with `DELIMITER` blocks, read as MySQL).
p95_ms_max = 25.0
# Resident memory after typing in it (the file itself is about 20 MiB of lines); the
# `editor_mysql` process too.
rss_mib_max = 160
# Search (`/` with a pattern found nowhere, key by key, and `n`): the most bytes one key
# searched, in passes over the text (a miss searches it once, `n` up to the next match; a
# count is bounded too, see the editor's search tests), and the most lines one frame highlighted (only those on screen; the editor has fewer
# rows than the 45 of the terminal). Their times are held to `p95_ms_max` above.
search_passes_max = 1.0
# A hinted statement of about 4.7 MB on screen while keys are typed next to it (in the
# `editor_block` process, for the copies of the statement its run's end lexes once): after an
# INSERT of 100,000 lines, above the same INSERT on one line, and above a statement under a
# comment header of 100,000 lines. The most bytes one key's frame lexed to check the hint
# against the text: nothing after a statement's `;` (a change there cannot change it), the
# changed line up to the statement's first token before it. The hint must still be there. The
# time of typing after the INSERT is held to `p95_ms_max`.
hint_check_bytes_max = 65536
highlight_lines_max = 45
# Visual block over the whole file (`gg Ctrl+V G $` then `y`, `d`, `u`, and `I` on every line;
# the `editor_block` scenario, in a process of its own so the copies of the whole text it leaves
# in registers and undo steps do not count in the other scenarios' memory): the most bytes one
# key's block operator walked, in passes over the text (`d` after `$`: the line widths, the
# yank, the new lines, the splice; a pass per line of the block would be quadratic), and, as for
# the keystrokes above, a time with a wide margin: the slowest of those keys with its frame
# (a developer machine: about 130 ms, for `d`).
block_ms_max = 500.0
block_passes_max = 4.0
# `:%s/orders/ORDERS/g` over the whole file through the command line, one undo step (also in the
# `editor_block` process, for the copies of the text it leaves in the undo steps): the bytes it
# searched, in passes over the text (each line once), and the slowest of three, typed with its
# frame, held to a one-shot time with a wide margin (a developer machine: about 55 ms).
subst_passes_max = 1.0
subst_ms_max = 1000.0

[grid]
# The search inside the result grid (2,000 rows of 24 columns of wide text at 160x45; the
# `grid` scenario): `/` with a pattern typed key by key, `Enter`, then `n` (each key's jobs
# answered before its frame). The most cells one frame looked up for the matches' highlight:
# the cells on screen only (at most 43 rows of at most 40 columns here; measured 60, the
# results pane under the editor shows a few rows), never the matches or the rows; without a
# search none at all (checked as 0). The key with its frame has a wide margin (a debug build
# on a loaded developer machine: 13 ms p95; the pattern keys search the 48,000 cells on a
# worker, `n` is a lookup in the matches found).
search_highlight_lookups_max = 1720
search_p95_ms_max = 50.0
# Sideways wheel bursts over the grid (a trackpad swipe; the same scenario, the search ended):
# 100 bursts of 24 `ScrollRight`, Shift+`ScrollDown`, `ScrollLeft` and Shift+`ScrollUp` events,
# handed over by the event loop's own grouping (`input::burst::take_burst`). Each burst is one
# frame, and it moves the view by all of its events (four characters each, unless it reached an
# end; checked as 0 bursts that moved short). The most cells one frame drew, as the grid's render
# counts them (`GridState::drawn_cells`: each column's part on screen on each row drawn, and its
# header): the columns on screen only, those cut by the view's edges included, never the columns
# off screen (measured 88; bounded like the highlight's lookups by the cells on screen).
hscroll_frames_per_burst_max = 1
hscroll_cells_per_frame_max = 1720

[idle]
secs = 20
rss_mib_max = 48
# With nothing to do the loop sleeps: no wakeups at all is what it measures.
wakeups_per_s_max = 0.2
cpu_pct_max = 1.0
# A paging countdown on screen: one frame a second (a little more for the rows arriving).
countdown_frames_per_s_max = 2.0

[startup]
runs = 10
first_frame_ms_p95_max = 250.0
# The Linux x86_64 binary of CI was 15.9 MiB before the plan views (0.7.0) added about 0.2 MiB:
# 17 MiB, with the release profile unchanged (opt-level "s" would shrink it a fifth but slow
# every frame). The MySQL driver (mysql_async without TLS) adds about 0.5 MiB to the macOS arm64
# binary (12.15 -> 12.67 MiB): 19 MiB, so it stays one binary. TLS (rustls with ring, the
# platform's certificate verifier) adds about 1.3 MiB on the CI's Linux x86_64 (18.63 -> 19.93
# MiB) and 1.0 MiB on macOS arm64 (13.8 -> 14.8 MiB): 21 MiB. Export to Excel (rust_xlsxwriter
# and zip) and Parquet (the parquet crate without Arrow, Snappy only) add 1.15 and 0.77 MiB on
# the CI's Linux x86_64 (20.81 -> 21.96 -> 22.73 MiB): 23 MiB. Session presets (the start-up
# setting checks for both databases, the explorer section and the forms) add about 0.3 MiB
# (22.74 -> 23.05 MiB): 24 MiB.
binary_mib_max = 24.0

[plan]
# A plan of 666 nodes (40 joins deep with a subplan each, parallel workers, a CTE, an Append
# over 500 partitions) in each view of the Plan tab at 160x45 while the selection moves: the
# key with its frame (a developer machine: under 1 ms in every view), and the most nodes one
# frame walked, as a multiple of the plan's nodes. A developer machine: the tree 1.4 (every node
# once for its guides), the icicle and the flame graph 2.0 (a layout pass and a drawing pass),
# the box diagram 3.0 (the layout, every family's lines and every box checked against the
# screen), the treemap 1.3, the timeline and the row flow 1.0, the raw text only the lines on
# screen.
p95_ms_max = 25.0
work_per_node_max = 4.0

[chart]
# 100,000 fetched rows (a timestamp and two numbers, spilled past the rows kept in memory) as a
# line chart, bars and horizontal bars at 160x45 while the cursor moves. A frame draws from the
# numbers read before: the key with its frame (a developer machine: under 0.5 ms), and the work
# of one frame (the line chart paints its plot's cells, about 2,000; bars walk the bars on
# screen). Reading the rows into a chart (a new result or another choice) walks each row once
# and a line chart's points and dot columns a bounded number of times: about 4 per row for
# lines, 1 for bars (a developer machine: 16-25 ms).
p95_ms_max = 25.0
work_per_frame_max = 8000.0
build_work_per_row_max = 6.0

[explorer]
# One connected profile with 20 schemas of 500 relations each, all listed and open (10,000
# relations, about 10,060 rows), the structure of 300 tables read (columns the filter finds),
# the explorer's `/` filter typed and erased a key at a time at 160x45: the key with its frame
# (the filter edit, the rows it shows, the frame drawn), from one letter that matches nearly
# every relation to an empty filter that shows every row. A developer machine: about 1.5 ms
# (p95 under 3 ms) under load.
p95_ms_max = 25.0
