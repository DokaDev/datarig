[package]
name = "datarig-tui"
description = "datarig terminal UI (Ratatui) and the `datarig` binary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
publish.workspace = true

[lib]
name = "datarig_tui"

[[bin]]
name = "datarig"
path = "src/main.rs"

[dependencies]
arboard.workspace = true
chrono.workspace = true
datarig-core.workspace = true
datarig-driver-mysql.workspace = true
datarig-driver-postgres.workspace = true
datarig-ssh.workspace = true
crossterm.workspace = true
futures.workspace = true
log.workspace = true
ratatui.workspace = true
regex.workspace = true
serde_json.workspace = true
shell-words.workspace = true
terminal-colorsaurus.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
unicode-segmentation.workspace = true
unicode-width.workspace = true

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[dev-dependencies]
datarig-core = { workspace = true, features = ["test-util"] }
insta.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync", "net"] }

[lints]
workspace = true
