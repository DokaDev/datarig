name: Bug report
description: Something does not work as it should.
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `datarig --version`.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS and terminal
      placeholder: macOS 15.1, iTerm2 3.5
    validations:
      required: true
  - type: input
    id: database
    attributes:
      label: Database and version
      placeholder: PostgreSQL 17.2
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Connect to ...
        2. Press ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Any error message or log output. Remove passwords and other secrets first.
      render: text
