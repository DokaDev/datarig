name: Release

# A pushed tag `vX.Y.Z` builds datarig for every target, checks the Homebrew formula by
# installing it from the fresh archives, publishes a GitHub release (archives, checksums and
# its notes) and updates the formula in the tap. The notes start with the version's section of
# What's new (docs/site/src/whats-new.md, written by scripts/changes.sh release in the release
# pull request); without one the run stops before the builds. After a stable release,
# the docs site is deployed to GitHub Pages from the tag. A `vX.Y.0-rc.N` tag is always a
# pre-release on GitHub; whether it also updates the tap depends on whether a stable release
# exists yet (.github/scripts/release-tap-eligible.sh): until the first one ships, the tap
# tracks the latest release candidate, so it stays installable during this pre-1.0 phase; once
# a stable release exists, the tap only tracks stable and later rc tags leave it alone. The tag
# must be the workspace version (.github/scripts/release-version.sh). Before anything else, a
# tag waits for the CI run on main for its commit and stops unless the commit is on main and
# every CI job passed (.github/scripts/release-ci-gate.sh). A pull request that changes the
# release files, or a manual run, does everything except publishing and deploying (and skips
# that wait; a missing What's new section only warns).
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/scripts/release-*.sh
      - .github/scripts/homebrew-formula.sh
      - .github/scripts/pg-query-build-deps.sh
      - scripts/third-party-notices.sh
      - scripts/changes.sh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  TAP_REPO: DokaDev/homebrew-tap

defaults:
  run:
    shell: bash

jobs:
  # Every other job depends on this one, so nothing is built or published for a tag whose CI
  # failed. It passes straight away for a pull request or a manual run.
  gate:
    name: CI passed on main
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Wait for CI on main
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          TIMEOUT: "2400"
        run: bash .github/scripts/release-ci-gate.sh

  plan:
    name: version
    needs: gate
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.version.outputs.publish }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      tap: ${{ steps.tap.outputs.tap }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        run: bash .github/scripts/release-version.sh
      - id: tap
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: bash .github/scripts/release-tap-eligible.sh
      # The version's section of What's new, the top of the release notes. A tag without one
      # stops here, before the builds; a run that publishes nothing only warns.
      - name: What's new
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PUBLISH: ${{ steps.version.outputs.publish }}
        run: |
          if notes=$(bash scripts/changes.sh notes "$VERSION"); then
            { echo "## What's new in $VERSION"; echo; echo "$notes"; } >> "$GITHUB_STEP_SUMMARY"
          else
            how="docs/site/src/whats-new.md has no section for $VERSION. In a pull request, run scripts/changes.sh release $VERSION (or, for an urgent patch without fragments, scripts/changes.sh release $VERSION --note \"Fix ...\"), merge it, then tag again."
            if [[ $PUBLISH == true ]]; then
              echo "::error title=No release notes::$how"
              exit 1
            fi
            echo "::warning title=No release notes::$how"
          fi

  # THIRD-PARTY-NOTICES.html, the same for every archive (cargo-about reads the dependencies of
  # every target).
  notices:
    name: third-party notices
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cargo install --locked cargo-about --version 0.9.2 --features cli
      - run: scripts/third-party-notices.sh
      - uses: actions/upload-artifact@v7
        with:
          name: notices
          path: THIRD-PARTY-NOTICES.html
          if-no-files-found: error

  build:
    name: build (${{ matrix.target }})
    needs: [plan, notices]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          # Cross-compiled on Apple silicon (the Intel runners are going away).
          - target: x86_64-apple-darwin
            os: macos-latest
          # The oldest supported Ubuntu: the binary needs this glibc or newer.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
          # Built and packaged, but running datarig on Windows is untested (see the notes).
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: C compiler and libclang for pg_query
        run: bash .github/scripts/pg-query-build-deps.sh
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --locked -p datarig-tui --target ${{ matrix.target }}
      - uses: actions/download-artifact@v8
        with:
          name: notices
      - name: Archive
        env:
          TAG: ${{ needs.plan.outputs.tag }}
          TARGET: ${{ matrix.target }}
        run: bash .github/scripts/release-archive.sh "$TAG" "$TARGET"
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  # The formula installs the archive of the machine it runs on and its test passes, before
  # anything is published: from the archives of this run (file:// URLs) in a local tap.
  formula:
    name: Homebrew formula (${{ matrix.os }})
    needs: [plan, build]
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_ANALYTICS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Homebrew on the PATH (Linux)
        if: runner.os == 'Linux'
        run: echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"
      - name: Install and test from a local tap
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          bash .github/scripts/homebrew-formula.sh "$TAG" "file://$PWD/dist" dist > datarig.rb
          ruby -c datarig.rb
          brew tap-new --no-git local/release-check
          cp datarig.rb "$(brew --repository)/Library/Taps/local/homebrew-release-check/Formula/datarig.rb"
          brew install --formula local/release-check/datarig
          brew test local/release-check/datarig
          brew uninstall --formula local/release-check/datarig
          brew untap local/release-check

  release:
    name: GitHub release
    needs: [plan, build, formula]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.plan.outputs.tag }}
          VERSION: ${{ needs.plan.outputs.version }}
          PRERELEASE: ${{ needs.plan.outputs.prerelease }}
        # The body: the What's new section, the paragraph about the archives, then GitHub's
        # generated list of pull requests (gh puts --notes-file text before the generated notes).
        run: |
          (cd dist && cat ./*.sha256 > SHA256SUMS)
          notes="The archives are for macOS and Linux (arm64 and x86_64) and Windows (x86_64); SHA256SUMS lists their checksums. The Windows build is untested: CI builds it and runs its tests, but nobody has used datarig on Windows yet."
          flags=()
          if [[ $PRERELEASE == true ]]; then
            notes="A release candidate: not published to Homebrew. $notes"
            flags+=(--prerelease)
          fi
          body=$RUNNER_TEMP/notes.md
          {
            bash scripts/changes.sh notes "$VERSION"
            echo
            echo "$notes"
          } > "$body"
          gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes --notes-file "$body" "${flags[@]}" dist/*

  # Skipped when plan.outputs.tap is false: a release candidate once a stable release exists
  # (release-tap-eligible.sh), or a candidate whose eligibility check itself failed (fail
  # closed). Without publishing (a pull request, a manual run) it stops before the push, after
  # checking that the deploy key may write to the tap.
  homebrew:
    name: Homebrew tap
    needs: [plan, formula, release]
    if: >-
      !cancelled() && needs.formula.result == 'success' && needs.plan.outputs.tap == 'true'
      && (needs.release.result == 'success' || needs.plan.outputs.publish == 'false')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Update Formula/datarig.rb
        env:
          TAG: ${{ needs.plan.outputs.tag }}
          TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          REPO: ${{ github.repository }}
          DRY_RUN: ${{ needs.plan.outputs.publish == 'true' && '0' || '1' }}
        run: |
          base="https://github.com/$REPO/releases/download/$TAG"
          bash .github/scripts/homebrew-formula.sh "$TAG" "$base" dist > datarig.rb
          bash .github/scripts/release-tap.sh "$TAG" datarig.rb

  # The docs site of a stable release, from its tag: built and checked like the `docs` job of
  # ci.yml, then deployed to GitHub Pages (https://dokadev.github.io/datarig/). Only after the
  # release is published, never for a release candidate, a pull request or a manual run. The
  # Homebrew tap does not wait for it: a failed deploy leaves the release and the tap as they
  # are and can be re-run on its own. The `github-pages` environment must allow tags `v*`.
  pages:
    name: docs site (GitHub Pages)
    needs: [plan, release]
    if: needs.plan.outputs.publish == 'true' && needs.plan.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - name: mdBook and lychee
        run: bash .github/scripts/docs-tools.sh
      - name: Build and check
        run: bash .github/scripts/docs-build.sh
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/site/book
      - id: deployment
        uses: actions/deploy-pages@v5
