name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same pull request cancels the run it supersedes; pushes to main all run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

# The toolchain (1.93.0 with rustfmt and clippy) comes from rust-toolchain.toml; rustup on the
# hosted runners installs it on the first cargo invocation. datarig-core's pg_query dependency
# compiles libpg_query (C) and runs bindgen: every job that builds it first runs
# .github/scripts/pg-query-build-deps.sh, which checks for the C compiler and libclang, installs
# what is missing (apt on Linux, choco on Windows, where it also sets LIBCLANG_PATH) and fails
# with a clear message otherwise.
defaults:
  run:
    shell: bash

jobs:
  # Whether a pull request changes more than prose (.github/scripts/code-changed.sh): one that
  # changes only README.md, CONTRIBUTING.md, docs/ or changelog fragments skips the builds,
  # tests, clippy, integration and performance jobs below (`code` is false), while the docs
  # site, the pages checked against the code (the `tests (ubuntu-latest)` job) and the cheap
  # checks still run. Each skipped check reports under its own name, as passed (a job skipped
  # by its condition concludes `skipped`, which counts as passing), so nothing waits for it.
  # Pushes to main always run everything: the release gate wants every job.
  changes:
    name: what changed
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.files.outputs.code }}
    steps:
      # The whole history: the diff is from the merge base of the pull request's two commits.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: files
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: bash .github/scripts/code-changed.sh

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cargo fmt --all --check

  # The docs site (docs/site): built with mdBook and checked (.github/scripts/docs-build.sh: no
  # include left as text, every link and anchor of the HTML, the README and CONTRIBUTING
  # offline), the same build release.yml deploys. Runs on every push and pull request like the
  # other jobs: the release gate wants each one to succeed. The generated pages and screens are
  # compared with their sources by the `test` jobs (tests/*_doc.rs, tests/book_*.rs). Also the
  # tests of the docs rule of pull requests (docs-rule.yml), of scripts/changes.sh and of
  # .github/scripts/code-changed.sh, the public text style (scripts/text-style.py), and that
  # every demo recording the pages show is made by a tape (.github/scripts/demo-refs.sh).
  docs:
    name: docs site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The tools' archives, kept between runs (fetch.sh): most runs download nothing.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ci-downloads/docs-tools
          key: docs-tools-${{ hashFiles('.github/scripts/docs-tools.sh') }}
      - name: mdBook and lychee
        run: bash .github/scripts/docs-tools.sh
      - name: Build and check
        run: bash .github/scripts/docs-build.sh
      # No em dash and British spelling in the text users read (CONTRIBUTING.md, "Public text
      # style").
      - name: Public text style
        run: |
          python3 scripts/text-style.py
          bash .github/scripts/tests/text-style-test.sh
      # Every recording the README and the site show is one a tape makes.
      - name: Demo recordings named in the pages
        run: bash .github/scripts/demo-refs.sh
      - name: Tests of docs-rule.sh, changes.sh and code-changed.sh
        run: |
          bash .github/scripts/tests/docs-rule-test.sh
          bash .github/scripts/tests/changes-test.sh
          bash .github/scripts/tests/code-changed-test.sh

  # On every OS the tests run on: code behind `cfg(unix)` / `cfg(windows)` warns differently.
  # Skipped step by step for a docs-only pull request: a matrix job skipped as a whole would
  # report one name with the matrix unexpanded instead of one per OS.
  clippy:
    name: clippy -D warnings (${{ matrix.os }})
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        if: needs.changes.outputs.code == 'true'
      - uses: Swatinem/rust-cache@v2
        if: needs.changes.outputs.code == 'true'
      - name: C compiler and libclang for pg_query
        if: needs.changes.outputs.code == 'true'
        run: bash .github/scripts/pg-query-build-deps.sh
      - if: needs.changes.outputs.code == 'true'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # For a docs-only pull request only the pages checked against the code run, on Linux (the
  # other steps are skipped one by one, as in `clippy`).
  test:
    name: tests (${{ matrix.os }})
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      RUN: ${{ needs.changes.outputs.code == 'true' && 'all' || (matrix.os == 'ubuntu-latest' && 'docs' || 'none') }}
    steps:
      - uses: actions/checkout@v7
        if: env.RUN != 'none'
      - uses: Swatinem/rust-cache@v2
        if: env.RUN != 'none'
      - name: C compiler and libclang for pg_query
        if: env.RUN != 'none'
        run: bash .github/scripts/pg-query-build-deps.sh
      # Every test target of every crate, so a new test file can never be left out. Without
      # DATARIG_TEST_PG_URL the PostgreSQL, pooler and SSH integration tests print SKIPPED; the
      # `integration` job runs them for real. insta never rewrites snapshots under CI, so any
      # rendering change fails here. The real OS keychain test only runs with
      # DATARIG_TEST_KEYCHAIN=1 and never when CI is set. On macOS the test of the
      # /usr/bin/security store runs for real, on a scratch keychain file of its own that it
      # deletes again (DATARIG_TEST_SECURITY_CLI=1). --no-fail-fast: a failing test target does
      # not hide the failures of the targets after it.
      - if: env.RUN == 'all'
        run: cargo test --workspace --locked --no-fail-fast
        env:
          DATARIG_TEST_SECURITY_CLI: ${{ runner.os == 'macOS' && '1' || '0' }}
      # The tests that read README.md, CONTRIBUTING.md and docs/: the generated pages and
      # screens against their sources, every name the pages use against the app's.
      - name: The pages checked against the code
        if: env.RUN == 'docs'
        run: >-
          cargo test -p datarig-tui --locked --no-fail-fast --test book_refs --test book_screens
          --test cli_doc --test config_doc --test keybindings_doc --test themes_doc

  integration:
    name: integration (PostgreSQL 17, PgBouncer, MySQL 8.4, SSH, TLS)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # Every host port a container publishes here (the services, the SSH bastion and the TLS
    # servers) lies below the runner's ephemeral ports (32768-60999): a port inside that range
    # can be held by an outgoing connection, such as one of those pulling the next image, and
    # the container then fails to start ("address already in use"). The first step checks it
    # (.github/scripts/host-ports.sh). The dev compose file's ports are a developer's own.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: datarig
          POSTGRES_PASSWORD: datarig
          POSTGRES_DB: datarig
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U datarig -d datarig"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      # PgBouncer in transaction mode without prepared statement support, as in
      # dev/docker-compose.yml (service `pgbouncer`): the driver's pooler_pg tests.
      pgbouncer:
        image: edoburu/pgbouncer:v1.25.2-p0
        env:
          DATABASE_URL: postgres://datarig:datarig@postgres:5432/datarig
          AUTH_TYPE: scram-sha-256
          POOL_MODE: transaction
          MAX_PREPARED_STATEMENTS: "0"
          SERVER_ROUND_ROBIN: "1"
          DEFAULT_POOL_SIZE: "3"
          MIN_POOL_SIZE: "3"
          IGNORE_STARTUP_PARAMETERS: extra_float_digits,options
        ports:
          - 16432:5432
      # MySQL 8.4 as in dev/docker-compose.yml (service `mysql`; utf8mb4 and utf8mb4_0900_ai_ci are
      # 8.4's defaults), loaded with dev/init-mysql/*.sql below.
      mysql:
        image: mysql:8.4
        env:
          MYSQL_USER: datarig
          MYSQL_PASSWORD: datarig
          MYSQL_DATABASE: datarig
          MYSQL_ROOT_PASSWORD: datarig-root
        ports:
          - 13306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pdatarig-root --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      DATARIG_TEST_PG_URL: postgres://datarig:datarig@127.0.0.1:15432/datarig
      # A missing service fails its tests here instead of skipping them.
      DATARIG_REQUIRE_PG: "1"
      DATARIG_TEST_POOLER_URL: postgres://datarig:datarig@127.0.0.1:16432/datarig
      DATARIG_REQUIRE_POOLER: "1"
      # The MySQL driver's suite (crates/drivers/mysql/tests/integration_mysql.rs); the admin URL
      # looks at its sessions from the side (performance_schema) and makes test accounts.
      DATARIG_TEST_MYSQL_URL: mysql://datarig:datarig@127.0.0.1:13306/shop
      DATARIG_TEST_MYSQL_ADMIN_URL: mysql://root:datarig-root@127.0.0.1:13306/
      DATARIG_REQUIRE_MYSQL: "1"
      # The SSH bastion started below (crates/ssh/tests/bastion.rs, crates/tui/tests/integration_ssh.rs).
      DATARIG_TEST_SSH_BASTION: 127.0.0.1:12222
      DATARIG_REQUIRE_SSH: "1"
      # The scratch TLS servers started below (crates/drivers/*/tests/tls_*.rs, and through the
      # bastion in crates/ssh/tests/bastion.rs); DATARIG_TEST_TLS_CERTS is set by that step.
      DATARIG_TEST_PG_TLS_URL: postgres://datarig:datarig@localhost:15433/datarig
      DATARIG_TEST_MYSQL_TLS_URL: mysql://datarig:datarig@localhost:13307/datarig
      DATARIG_TEST_MYSQL_TLS_ADMIN_URL: mysql://root:datarig-root@localhost:13307/
      DATARIG_REQUIRE_TLS: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Host ports below the ephemeral range
        run: bash .github/scripts/host-ports.sh 15432 16432 13306 12222 15433 13307
      - uses: Swatinem/rust-cache@v2
      - name: C compiler and libclang for pg_query
        run: bash .github/scripts/pg-query-build-deps.sh
      - name: Load dev/init/*.sql
        run: bash .github/scripts/load-test-db.sh
      - name: Load dev/init-mysql/*.sql
        env:
          MYSQL_CONTAINER: ${{ job.services.mysql.id }}
        run: bash .github/scripts/load-mysql-test-db.sh "$MYSQL_CONTAINER"
      # The SSH bastion of dev/ssh on the services' network, so it reaches `postgres`,
      # `pgbouncer` and `mysql` by name; its keys are made here, never committed.
      - name: SSH bastion
        env:
          NETWORK: ${{ job.services.postgres.network }}
        run: bash .github/scripts/start-ssh-bastion.sh "$NETWORK"
      # PostgreSQL 17 with TLS logins only and MySQL 8.4 that takes TLS only (dev/tls), on the
      # services' network (the bastion reaches them as pg-tls.test and mysql-tls.test); their
      # certificates are made here, never committed.
      - name: TLS servers
        env:
          NETWORK: ${{ job.services.postgres.network }}
          PG_TLS_PORT: "15433"
          MYSQL_TLS_PORT: "13307"
        run: |
          sh dev/tls/make-certs.sh "$RUNNER_TEMP/tls"
          sh dev/tls/up.sh "$RUNNER_TEMP/tls" "$NETWORK"
          echo "DATARIG_TEST_TLS_CERTS=$RUNNER_TEMP/tls" >> "$GITHUB_ENV"
      # The MySQL client the gated MySQL tests of datarig-core read their scripts with
      # (tests/mysql_split.rs, tests/mysql_classify.rs): the service container's own.
      - run: cargo test --workspace --locked
        env:
          DATARIG_TEST_MYSQL_CLIENT: docker exec -i ${{ job.services.mysql.id }} mysql -udatarig -pdatarig shop
      # The driver's PostgreSQL suite once more with every session, test connection and cancel
      # request going through a dialer (a plain TCP one), as they do through an SSH tunnel.
      - name: The PostgreSQL suite through a dialer
        env:
          DATARIG_TEST_DIAL: tcp
        run: cargo test -p datarig-driver-postgres --test integration_pg --locked
      # The MySQL suite through a dialer likewise.
      - name: The MySQL suite through a dialer
        env:
          DATARIG_TEST_DIAL: tcp
        run: cargo test -p datarig-driver-mysql --test integration_mysql --test definer_mysql --locked
      # The MySQL suite once more over TLS (the profile's default, PREFERRED: the service's
      # server offers TLS with its own certificate), so the session's wire works the same above it.
      - name: The MySQL suite over TLS
        env:
          DATARIG_TEST_MYSQL_SSLMODE: PREFERRED
        run: cargo test -p datarig-driver-mysql --test integration_mysql --test definer_mysql --locked
      # The tests drop the tables they create, even when they fail (tests/pg_clean in the
      # driver crate): nothing may be left in `public`, which the init scripts leave empty.
      - name: The tests left the database clean
        if: ${{ !cancelled() }}
        env:
          PGPASSWORD: datarig
        run: |
          left=$(psql -h 127.0.0.1 -p 15432 -U datarig -d datarig -Atc \
            "SELECT string_agg(tablename, ', ') FROM pg_tables WHERE schemaname = 'public'")
          if [ -n "$left" ]; then
            echo "tables left in public: $left"
            exit 1
          fi
      # Nor anything named zz_ on the MySQL server: tables, views, routines, databases, accounts
      # and grants (a grant on a table outlives the table).
      - name: The tests left the MySQL server clean
        if: ${{ !cancelled() }}
        env:
          MYSQL_CONTAINER: ${{ job.services.mysql.id }}
        run: |
          left=$(docker exec -i "$MYSQL_CONTAINER" mysql -uroot -pdatarig-root -N -B -e "
            SELECT CONCAT(TABLE_SCHEMA, '.', TABLE_NAME) FROM information_schema.TABLES WHERE TABLE_NAME LIKE 'zz%'
            UNION ALL SELECT CONCAT(ROUTINE_SCHEMA, '.', ROUTINE_NAME) FROM information_schema.ROUTINES
              WHERE ROUTINE_NAME LIKE 'zz%'
            UNION ALL SELECT SCHEMA_NAME FROM information_schema.SCHEMATA WHERE SCHEMA_NAME LIKE 'zz%'
            UNION ALL SELECT CONCAT(User, '@', Host) FROM mysql.user WHERE User LIKE 'zz%'
            UNION ALL SELECT CONCAT('grant on ', Db) FROM mysql.db WHERE User LIKE 'zz%' OR Db LIKE 'zz%'
            UNION ALL SELECT CONCAT('grant on ', Db, '.', Table_name) FROM mysql.tables_priv
              WHERE User LIKE 'zz%' OR Table_name LIKE 'zz%'")
          if [ -n "$left" ]; then
            echo "left on the MySQL server: $left"
            exit 1
          fi

  # Performance budgets (docs/perf.md): round trips per statement through a latency proxy
  # (exact counts, also through the SSH bastion), memory while paging 4,000,000 rows (flat past
  # the window of rows kept in memory), keystroke-to-frame time in a 5 MB file, idle memory, CPU
  # and wakeups, and startup time, held to crates/bench/budgets.toml. The binary
  # scenarios run the release build in tmux (a server of their own, `-L perf`).
  perf:
    name: performance budgets
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # Host ports below the runner's ephemeral ports, as in `integration`.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: datarig
          POSTGRES_PASSWORD: datarig
          POSTGRES_DB: datarig
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U datarig -d datarig"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      # The MySQL driver's round trips (`rtt_mysql`) need a server only: their rows are a
      # temporary table of the session's own.
      mysql:
        image: mysql:8.4
        env:
          MYSQL_USER: datarig
          MYSQL_PASSWORD: datarig
          MYSQL_DATABASE: datarig
          MYSQL_ROOT_PASSWORD: datarig-root
        ports:
          - 13306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pdatarig-root --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      DATARIG_TEST_PG_URL: postgres://datarig:datarig@127.0.0.1:15432/datarig
      DATARIG_TEST_MYSQL_URL: mysql://datarig:datarig@127.0.0.1:13306/datarig
      DATARIG_SECRET_STORE: memory
      DATARIG_TEST_SSH_BASTION: 127.0.0.1:12222
    steps:
      - uses: actions/checkout@v7
      - name: Host ports below the ephemeral range
        run: bash .github/scripts/host-ports.sh 15432 13306 12222
      - uses: Swatinem/rust-cache@v2
      - name: C compiler and libclang for pg_query
        run: bash .github/scripts/pg-query-build-deps.sh
      - name: Load dev/init/*.sql
        run: bash .github/scripts/load-test-db.sh
      - name: SSH bastion
        env:
          NETWORK: ${{ job.services.postgres.network }}
        run: bash .github/scripts/start-ssh-bastion.sh "$NETWORK"
      - name: tmux
        run: |
          if ! command -v tmux >/dev/null; then
            sudo apt-get -o Acquire::Retries=5 update && sudo apt-get -o Acquire::Retries=5 install -y tmux
          fi
      - run: cargo build --release --locked -p datarig-tui -p datarig-bench
      - run: ./target/release/datarig-bench budget --scratch "$RUNNER_TEMP/datarig-perf" --out "$RUNNER_TEMP/perf.jsonl"
      - name: Measurements
        if: ${{ !cancelled() }}
        run: cat "$RUNNER_TEMP/perf.jsonl" || true

  # Licenses (permissive only), advisories, bans and sources: deny.toml.
  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The release binary (check-tools.sh), kept between runs under a key of its own (the
      # actionlint job keeps the other archive): most runs download nothing. The arguments are
      # the ones cargo-deny-action ran it with.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ci-downloads/check-tools
          key: check-tools-cargo-deny-${{ hashFiles('.github/scripts/check-tools.sh') }}
      - name: cargo-deny
        run: bash .github/scripts/check-tools.sh cargo-deny
      - run: cargo deny --log-level warn --manifest-path ./Cargo.toml --all-features check

  # RustSec advisories once more with cargo-audit; judged ones are listed with the reason in
  # .cargo/audit.toml (and in deny.toml).
  audit:
    name: cargo audit
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Built once per version and kept between runs: most runs neither download nor build it.
      - uses: actions/cache@v6
        id: cargo-audit
        with:
          path: ~/.cache/ci-tools/cargo-audit
          key: cargo-audit-0.22.2-${{ runner.os }}-${{ runner.arch }}
      - if: steps.cargo-audit.outputs.cache-hit != 'true'
        env:
          CARGO_NET_RETRY: 10
        run: cargo install --locked cargo-audit --version 0.22.2 --root ~/.cache/ci-tools/cargo-audit
      - run: echo "$HOME/.cache/ci-tools/cargo-audit/bin" >> "$GITHUB_PATH"
      - run: cargo audit

  # THIRD-PARTY-NOTICES.html for the release artifacts (cargo-about, about.toml, about.hbs and
  # the C code notices of vendor/licenses/pg_query).
  notices:
    name: third-party notices
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Built once per version and kept between runs: most runs neither download nor build it.
      - uses: actions/cache@v6
        id: cargo-about
        with:
          path: ~/.cache/ci-tools/cargo-about
          key: cargo-about-0.9.2-cli-${{ runner.os }}-${{ runner.arch }}
      - if: steps.cargo-about.outputs.cache-hit != 'true'
        env:
          CARGO_NET_RETRY: 10
        run: cargo install --locked cargo-about --version 0.9.2 --features cli --root ~/.cache/ci-tools/cargo-about
      - run: echo "$HOME/.cache/ci-tools/cargo-about/bin" >> "$GITHUB_PATH"
      - run: scripts/third-party-notices.sh
      - uses: actions/upload-artifact@v7
        with:
          name: third-party-notices
          path: THIRD-PARTY-NOTICES.html

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The release binary (check-tools.sh), kept between runs under a key of its own (the
      # cargo deny job keeps the other archive): most runs download nothing.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ci-downloads/check-tools
          key: check-tools-actionlint-${{ hashFiles('.github/scripts/check-tools.sh') }}
      - name: actionlint
        run: bash .github/scripts/check-tools.sh actionlint
      - run: actionlint -color
